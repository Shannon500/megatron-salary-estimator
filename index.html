 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Megatron Salary Estimator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 28px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
            color: #d1d5db;
            font-size: 17px;
        }

        .container {
            max-width: 520px;
            margin: 30px auto;
            padding: 20px;
        }

        .calculator {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            font-size: 27px;
        }

        .description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            background: white;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #results {
            display: none;
            margin-top: 25px;
            background: #f3f4f6;
            padding: 18px;
            border-radius: 12px;
        }

        .result {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .result:last-child {
            border-bottom: none;
        }

        .amount {
            font-weight: bold;
            text-align: right;
        }

        .total {
            font-size: 19px;
            font-weight: bold;
        }

        .section-title {
            margin-top: 25px;
            margin-bottom: 5px;
            font-size: 18px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>Megatron</h1>
    <p>Salary Estimator</p>
</header>

<div class="container">

    <div class="calculator">

        <h2>Calculate Your Salary</h2>

        <p class="description">
            Estimate your regular earnings and overtime pay.
        </p>

        <label for="currency">Currency</label>

        <select id="currency">
            <option value="$">USD - US Dollar ($)</option>
            <option value="KSh">KES - Kenyan Shilling (KSh)</option>
            <option value="£">GBP - British Pound (£)</option>
            <option value="€">EUR - Euro (€)</option>
            <option value="C$">CAD - Canadian Dollar (C$)</option>
            <option value="A$">AUD - Australian Dollar (A$)</option>
            <option value="R">ZAR - South African Rand (R)</option>
            <option value="₦">NGN - Nigerian Naira (₦)</option>
        </select>


        <label for="hourly">Hourly Pay</label>

        <input
            type="number"
            id="hourly"
            placeholder="Example: 1000"
            min="0"
            step="0.01"
        >


        <label for="hours">Regular Hours Per Week</label>

        <input
            type="number"
            id="hours"
            placeholder="Example: 40"
            min="0"
            step="0.1"
            value="40"
        >


        <label for="overtime">Overtime Hours Per Week</label>

        <input
            type="number"
            id="overtime"
            placeholder="Example: 5"
            min="0"
            step="0.1"
            value="0"
        >


        <label for="overtimeRate">Overtime Rate</label>

        <select id="overtimeRate">
            <option value="1.5">1.5× (Standard)</option>
            <option value="2">2×</option>
            <option value="2.5">2.5×</option>
            <option value="3">3×</option>
        </select>


        <button onclick="calculateSalary()">
            Calculate Salary
        </button>


        <div id="results">

            <div class="section-title">
                Regular Pay
            </div>

            <div class="result">
                <span>Hourly:</span>
                <span class="amount" id="hourlyResult"></span>
            </div>

            <div class="result">
                <span>Regular Weekly:</span>
                <span class="amount" id="regularWeeklyResult"></span>
            </div>


            <div class="section-title">
                Overtime
            </div>

            <div class="result">
                <span>Overtime Rate:</span>
                <span class="amount" id="rateResult"></span>
            </div>

            <div class="result">
                <span>Overtime Weekly:</span>
                <span class="amount" id="overtimeResult"></span>
            </div>


            <div class="section-title">
                Total Estimated Earnings
            </div>

            <div class="result total">
                <span>Weekly:</span>
                <span class="amount" id="weeklyResult"></span>
            </div>

            <div class="result total">
                <span>Monthly:</span>
                <span class="amount" id="monthlyResult"></span>
            </div>

            <div class="result total">
                <span>Yearly:</span>
                <span class="amount" id="yearlyResult"></span>
            </div>

        </div>

    </div>

</div>


<footer>
    © 2026 Megatron Salary Estimator
</footer>


<script>

function calculateSalary() {

    const hourly = parseFloat(
        document.getElementById("hourly").value
    );

    const hours = parseFloat(
        document.getElementById("hours").value
    );

    const overtime = parseFloat(
        document.getElementById("overtime").value
    );

    const overtimeRate = parseFloat(
        document.getElementById("overtimeRate").value
    );

    const currency =
        document.getElementById("currency").value;


    if (isNaN(hourly) || hourly < 0) {

        alert("Please enter your hourly pay.");

        return;
    }


    if (isNaN(hours) || hours < 0) {

        alert("Please enter your regular hours per week.");

        return;
    }


    if (isNaN(overtime) || overtime < 0) {

        alert("Please enter your overtime hours.");

        return;
    }


    const regularWeekly = hourly * hours;

    const overtimeHourly = hourly * overtimeRate;

    const overtimeWeekly = overtimeHourly * overtime;

    const totalWeekly = regularWeekly + overtimeWeekly;

    const monthly = totalWeekly * 52 / 12;

    const yearly = totalWeekly * 52;


    document.getElementById("hourlyResult").textContent =
        currency + " " + hourly.toFixed(2);

    document.getElementById("regularWeeklyResult").textContent =
        currency + " " + regularWeekly.toFixed(2);

    document.getElementById("rateResult").textContent =
        overtimeRate.toFixed(1) + "×";

    document.getElementById("overtimeResult").textContent =
        currency + " " + overtimeWeekly.toFixed(2);

    document.getElementById("weeklyResult").textContent =
        currency + " " + totalWeekly.toFixed(2);

    document.getElementById("monthlyResult").textContent =
        currency + " " + monthly.toFixed(2);

    document.getElementById("yearlyResult").textContent =
        currency + " " + yearly.toFixed(2);


    document.getElementById("results").style.display = "block";
}

</script>

</body>
 </html>
